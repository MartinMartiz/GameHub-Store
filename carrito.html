<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameHub Store - Carrito de Compras</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>GameHub Store</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="carrito.html">Carrito</a></li>
        <li><a href="checkout.html">Checkout</a></li>
        <li><a href="mis-ordenes.html">Mis Órdenes</a></li>
      </ul>
    </nav>
  </header>

  <main style="padding: 2rem; max-width: 1200px; margin: 0 auto;">
    <h2>Carrito de Compras</h2>

    <section id="carrito-vacio" style="display: none; text-align: center; padding: 3rem 0;">
      <p style="font-size: 1.2rem; margin-bottom: 1rem;">Tu carrito de compras está vacío.</p>
      <a href="catalogo.html" class="boton-primario" style="text-decoration: none; display: inline-block;">Ver Catálogo</a>
    </section>

    <div id="resumen-carrito" style="display: flex; gap: 2rem; flex-wrap: wrap; margin-top: 1.5rem;">
      <section style="flex: 2; min-width: 300px;" id="lineas-carrito">
      </section>

      <aside style="flex: 1; min-width: 280px; background-color: var(--color-superficie); padding: 1.5rem; border-radius: var(--radio-borde); height: fit-content;">
        <h3>Resumen de la Compra</h3>
        <hr style="border-color: var(--color-fondo); margin: 1rem 0;">

        <div style="margin-bottom: 1.5rem;">
          <label for="input-cupon" style="display: block; margin-bottom: 0.5rem;">¿Tienes un cupón?</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="input-cupon" placeholder="Ej: GAMER10" style="padding: 0.5rem; flex: 1; border-radius: var(--radio-borde); border: 1px solid var(--color-fondo);">
            <button class="boton-primario" type="button" onclick="aplicarCuponDescuento()">Aplicar</button>
          </div>
          <p id="mensaje-cupon" class="mensaje-error" style="margin-top: 0.5rem;"></p>
        </div>

        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
          <span>Subtotal:</span>
          <span id="resumen-subtotal">$0</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; color: var(--color-acento);">
          <span>Descuento:</span>
          <span id="resumen-descuento">-$0</span>
        </div>
        <hr style="border-color: var(--color-fondo); margin: 1rem 0;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-size: 1.2rem; font-weight: bold;">
          <span>Total:</span>
          <span id="resumen-total">$0</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.8rem;">
          <a href="checkout.html" class="boton-primario" style="text-align: center; text-decoration: none;">Ir al Checkout</a>
          <button type="button" onclick="vaciarCarrito()" style="background: transparent; color: var(--color-error); border: 1px solid var(--color-error); padding: 0.5rem; border-radius: var(--radio-borde); cursor: pointer;">
            Vaciar Carrito
          </button>
        </div>
      </aside>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 GameHub Store - Todos los derechos reservados.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/validation.js"></script>
</body>
</html>
